<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your Smart Task Dashboard account.">
    <title>Register — TaskFlow</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        .auth-page::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(99,102,241,0.08), transparent 70%);
            top: -100px;
            left: -100px;
            pointer-events: none;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 1;
        }

        .auth-brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-logo {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary-500), var(--primary-700));
            border-radius: var(--radius-md);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.3rem;
            margin-bottom: 12px;
        }

        .auth-brand-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 36px 32px;
            box-shadow: var(--shadow-lg);
        }

        .auth-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .auth-subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 28px;
        }

        .auth-form .form-group { margin-bottom: 18px; }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper .form-input { padding-left: 42px; }

        .input-wrapper .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .input-wrapper .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            background: none;
            border: none;
            padding: 4px;
        }

        .input-wrapper .toggle-password:hover { color: var(--text-primary); }

        .auth-submit { width: 100%; margin-top: 6px; }

        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .auth-footer a {
            color: var(--primary-500);
            font-weight: 500;
        }

        .auth-footer a:hover { text-decoration: underline; }

        .auth-error {
            background: var(--danger-light);
            color: var(--danger);
            padding: 10px 14px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            margin-bottom: 16px;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .auth-error.visible { display: flex; }

        [data-theme="dark"] .auth-error { background: rgba(239, 68, 68, 0.12); }

        .password-strength {
            margin-top: 6px;
            display: flex;
            gap: 4px;
        }

        .strength-bar {
            flex: 1;
            height: 4px;
            border-radius: 2px;
            background: var(--border-color);
            transition: background var(--transition-fast);
        }

        .strength-bar.weak { background: var(--danger); }
        .strength-bar.medium { background: var(--warning); }
        .strength-bar.strong { background: var(--success); }

        .strength-text {
            font-size: 0.75rem;
            margin-top: 4px;
            color: var(--text-muted);
        }

        .theme-toggle-auth {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 10px;
            border-radius: var(--radius-md);
            z-index: 10;
            transition: all var(--transition-fast);
            box-shadow: var(--shadow-sm);
        }

        .theme-toggle-auth:hover {
            color: var(--warning);
            border-color: var(--primary-300);
        }
    </style>
</head>
<body>
    <!-- Theme Toggle -->
    <button class="theme-toggle-auth" id="theme-toggle" title="Toggle theme">
        <i class="fas fa-moon" id="theme-icon"></i>
    </button>

    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-brand">
                <div class="auth-logo"><i class="fas fa-bolt"></i></div>
                <div class="auth-brand-name">TaskFlow</div>
            </div>

            <div class="auth-card">
                <h1 class="auth-title">Create your account</h1>
                <p class="auth-subtitle">Start managing your tasks like a pro</p>

                <div class="auth-error" id="auth-error">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="error-text"></span>
                </div>

                <form class="auth-form" id="register-form">
                    <div class="form-group">
                        <label class="form-label" for="name">Full Name</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user input-icon"></i>
                            <input type="text" id="name" class="form-input" placeholder="John Doe" required autocomplete="name">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="email">Email Address</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="email" class="form-input" placeholder="you@example.com" required autocomplete="email">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="password" class="form-input" placeholder="At least 6 characters" required autocomplete="new-password">
                            <button type="button" class="toggle-password" id="toggle-password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="password-strength" id="password-strength">
                            <div class="strength-bar" id="str-1"></div>
                            <div class="strength-bar" id="str-2"></div>
                            <div class="strength-bar" id="str-3"></div>
                            <div class="strength-bar" id="str-4"></div>
                        </div>
                        <div class="strength-text" id="strength-text"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="confirmPassword">Confirm Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="confirmPassword" class="form-input" placeholder="Re-enter your password" required autocomplete="new-password">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg auth-submit" id="register-btn">
                        <span id="btn-text">Create Account</span>
                        <div class="spinner" id="btn-spinner" style="display:none; width:20px; height:20px; border-width:2px;"></div>
                    </button>
                </form>

                <div class="auth-footer">
                    Already have an account? <a href="/login">Sign in</a>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Theme toggle
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        themeIcon.className = savedTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';

        themeToggle.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            themeIcon.className = next === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        });

        // Redirect if already logged in
        if (localStorage.getItem('token')) {
            window.location.href = '/dashboard';
        }

        // Password strength indicator
        document.getElementById('password').addEventListener('input', (e) => {
            const pwd = e.target.value;
            const bars = [
                document.getElementById('str-1'),
                document.getElementById('str-2'),
                document.getElementById('str-3'),
                document.getElementById('str-4')
            ];
            const strengthText = document.getElementById('strength-text');

            // Reset
            bars.forEach(b => b.className = 'strength-bar');
            strengthText.textContent = '';

            if (pwd.length === 0) return;

            let score = 0;
            if (pwd.length >= 6) score++;
            if (pwd.length >= 8) score++;
            if (/[A-Z]/.test(pwd) && /[a-z]/.test(pwd)) score++;
            if (/[0-9]/.test(pwd) || /[^a-zA-Z0-9]/.test(pwd)) score++;

            const levels = ['weak', 'weak', 'medium', 'strong', 'strong'];
            const labels = ['', 'Weak', 'Fair', 'Good', 'Strong'];

            for (let i = 0; i < score; i++) {
                bars[i].classList.add(levels[score]);
            }
            strengthText.textContent = labels[score] || '';
            strengthText.style.color = score <= 1 ? 'var(--danger)' : score <= 2 ? 'var(--warning)' : 'var(--success)';
        });

        // Toggle password visibility
        document.getElementById('toggle-password').addEventListener('click', () => {
            const pwd = document.getElementById('password');
            const icon = document.querySelector('#toggle-password i');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                pwd.type = 'password';
                icon.className = 'fas fa-eye';
            }
        });

        // Register form handler
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorDiv = document.getElementById('auth-error');
            const errorText = document.getElementById('error-text');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');

            errorDiv.classList.remove('visible');

            // Client-side validation
            if (!name || !email || !password || !confirmPassword) {
                errorText.textContent = 'Please fill in all fields.';
                errorDiv.classList.add('visible');
                return;
            }

            if (name.length < 2) {
                errorText.textContent = 'Name must be at least 2 characters.';
                errorDiv.classList.add('visible');
                return;
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                errorText.textContent = 'Please enter a valid email address.';
                errorDiv.classList.add('visible');
                return;
            }

            if (password.length < 6) {
                errorText.textContent = 'Password must be at least 6 characters.';
                errorDiv.classList.add('visible');
                return;
            }

            if (password !== confirmPassword) {
                errorText.textContent = 'Passwords do not match.';
                errorDiv.classList.add('visible');
                return;
            }

            btnText.textContent = 'Creating account...';
            btnSpinner.style.display = 'block';
            document.getElementById('register-btn').disabled = true;

            try {
                const data = await API.register({ name, email, password, confirmPassword });

                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showToast('Account created! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 500);
                } else {
                    errorText.textContent = data.message || 'Registration failed.';
                    errorDiv.classList.add('visible');
                }
            } catch (error) {
                errorText.textContent = 'Server unavailable. Please try again later.';
                errorDiv.classList.add('visible');
            } finally {
                btnText.textContent = 'Create Account';
                btnSpinner.style.display = 'none';
                document.getElementById('register-btn').disabled = false;
            }
        });
    </script>
</body>
</html>
